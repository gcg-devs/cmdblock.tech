version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "25565:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - CHROMIUM_URL=ws://chromium:3000/chromium
    depends_on:
      - chromium
    restart: always

  chromium:
    image: ghcr.io/browserless/chromium
    environment:
      - TOKEN=
      - TIMEOUT=60000
      - CONCURRENT=5
    restart: always
